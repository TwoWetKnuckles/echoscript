name: Quality checks
on:
  push:
    branches: [main, "feature/**", "fix/**", "security/**"]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true
jobs:
  web-api-evidence:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "24"
          cache: npm
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.12"
      - run: npm ci --ignore-scripts
      - run: npm run build
      - run: npm run lint
      - run: npm test
      - run: npm audit --audit-level=high
      - name: Install local decoder and verified model
        run: |
          python -m venv .venv
          .venv/bin/pip install -r services/api/requirements.txt
          .venv/bin/pip install -r services/api/qa-requirements.txt
          python scripts/setup-model.py
      - name: Diagnose local decoder with controlled synthetic fixture
        env:
          VOSK_MODEL_PATH: ${{ github.workspace }}/models/vosk-model-small-en-us-0.15
        run: |
          mkdir -p qa-output/local-provider
          .venv/bin/python services/api/vosk_worker.py < specs/fixtures/synthetic-speech.wav > qa-output/local-provider/synthetic-provider-preflight.json
      - name: Seven local engine/provider workflows (not the full application beta gate)
        env:
          VOSK_PYTHON: ${{ github.workspace }}/.venv/bin/python
          VOSK_MODEL_PATH: ${{ github.workspace }}/models/vosk-model-small-en-us-0.15
          DOC_PYTHON: ${{ github.workspace }}/.venv/bin/python
        run: node --expose-gc tools/qa-local.mjs
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: synthetic-local-workflow-results
          path: qa-output/local-provider/
          retention-days: 7
  rust-streaming:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - run: rustup toolchain install 1.99.1 --profile minimal --component clippy,rustfmt
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace --locked
      - run: cargo build --workspace --release --locked
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - name: Compile, unit test, lint, instrumentation APK and unsigned release
        working-directory: apps/android
        run: ./gradlew :app:assembleDebug :app:testDebugUnitTest :app:lintDebug :app:assembleDebugAndroidTest :app:assembleRelease --no-daemon
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: android-development-apks-and-reports
          path: |
            apps/android/app/build/outputs/apk/
            apps/android/app/build/reports/
            apps/android/app/build/test-results/
          retention-days: 7
  android-device:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        api: [29, 36]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - name: Enable hardware virtualization for the disposable emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run encrypted-vault round trip and tamper/resource regression on Android
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          target: google_apis
          disable-animations: true
          working-directory: apps/android
          script: ./gradlew :app:connectedDebugAndroidTest --no-daemon
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: android-device-${{ matrix.api }}-reports
          path: |
            apps/android/app/build/reports/androidTests/
            apps/android/app/build/outputs/androidTest-results/
          retention-days: 7
